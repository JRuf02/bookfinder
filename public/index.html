<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ISBN Scanner</title>
    <style>
      body { font-family: sans-serif; text-align: center; margin-top: 2rem; }
      video { width: 400px; height: auto; border: 2px solid #000; }
    </style>
  </head>
  <body>
    <h1>Scan ISBN Barcode</h1>
    <video id="video"></video>
    <p>ISBN: <span id="output">Waiting...</span></p>

    <script type="module">
      import { BrowserMultiFormatReader } from 'https://cdn.jsdelivr.net/npm/@zxing/browser@latest/+esm';

      const video = document.getElementById('video');
      const output = document.getElementById('output');
      const reader = new BrowserMultiFormatReader();

      reader.decodeFromVideoDevice(null, video, (result, error) => {
        if (result) output.textContent = result.getText();
      });
    </script>
  </body>
</html>
